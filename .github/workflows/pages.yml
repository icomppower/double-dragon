name: Deploy dist to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Mechanics checks
        run: node verify.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Browser playtest (desktop + phone)
        run: |
          npm ci
          python3 -m http.server 8124 --directory dist --bind 127.0.0.1 &
          sleep 1
          node playtest.mjs http://127.0.0.1:8124
          node playtest.mjs http://127.0.0.1:8124 --mobile
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
